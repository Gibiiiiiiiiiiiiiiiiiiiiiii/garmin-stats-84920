<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard corsa</title>
<style>
:root{--ink:#111;--red:#ff2e2e;--yellow:#ffd60a;--bg:#f4f1ea;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif}
header{background:var(--yellow);border-bottom:6px solid var(--ink);padding:22px 0}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
h1{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(28px,5vw,46px);margin:0;letter-spacing:1px;text-transform:uppercase}
.sub{font-size:13px;margin-top:4px;font-weight:600}
.count{background:var(--ink);color:var(--yellow);padding:10px 18px;text-align:center;border-radius:4px}
.count b{display:block;font-family:Impact,"Arial Black",sans-serif;font-size:40px;line-height:1}
.count span{font-size:12px;text-transform:uppercase;letter-spacing:1px}
.bar{display:flex;gap:8px;margin:20px 0 6px}
.bar button{font:inherit;font-weight:800;text-transform:uppercase;border:3px solid var(--ink);background:#fff;padding:7px 14px;cursor:pointer}
.bar button.on{background:var(--ink);color:var(--yellow)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:16px 0 22px}
.kpi{background:var(--card);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:12px 14px}
.kpi span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
.kpi b{display:block;font-family:Impact,"Arial Black",sans-serif;font-size:34px;color:var(--red);margin-top:2px}
.kpi small{font-size:12px;color:#555}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:20px}
.card{background:var(--card);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:14px 16px;min-width:0}
.card h2{margin:0 0 4px;font-size:15px;text-transform:uppercase;letter-spacing:1px}
.card.main{grid-column:1/-1}
.leg{font-size:12px;margin-bottom:6px;font-weight:600}
.leg i{display:inline-block;width:11px;height:11px;margin:0 5px 0 12px;vertical-align:-1px}
.leg i:first-child{margin-left:0}
.grid line.grid{stroke:#ddd;stroke-width:1}
text.ax{font-size:11px;fill:#555}
.empty{padding:50px 0;text-align:center;color:#777;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;border-bottom:3px solid var(--ink);padding:6px 8px}
td{padding:7px 8px;border-bottom:1px solid #e3e3e3}
.tw{overflow-x:auto}
#tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:7px 10px;font-size:12px;border-radius:4px;display:none;z-index:9;max-width:240px}
.pill{display:inline-block;font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:1px;padding:4px 10px;border:3px solid var(--ink);margin-right:10px;vertical-align:2px}
.p-hi{background:var(--red);color:#fff}.p-mid{background:#ff8a00}.p-lo{background:var(--yellow)}.p-race{background:var(--ink);color:var(--yellow)}
.nx{font-size:19px;margin:8px 0 2px}
.when{font-size:13px;color:#555;margin-bottom:8px}
.kv td:first-child{font-weight:700;width:170px;vertical-align:top}
.rem{margin:10px 0 0;padding-left:20px;font-size:14px}.rem li{margin:5px 0}
.hint{font-size:12px;color:#555;margin:0 0 8px}
tr.now td{background:#fff3b0}
.ok{color:#0a7a2f;font-weight:700}.no{color:#b00020;font-weight:700}.todo{color:#666}
td small{color:#555}
footer{text-align:center;font-size:12px;color:#666;padding:26px 0 40px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>

    o.series.forEach(s=>{
      const sp=s.pts.slice().sort((a,b)=>a.t-b.t);
      if(sp.length>1)mk("path",{d:sp.map((p,i)=>(i?"L":"M")+X(p.t).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" "),fill:"none",stroke:s.color,"stroke-width":2.5,"stroke-linejoin":"round"},svg);
      sp.forEach(p=>{
        mk("circle",{cx:X(p.t),cy:Y(p.y),r:3.5,fill:s.color,stroke:"#fff","stroke-width":1},svg);
        anchors.push({x:X(p.t),y:Y(p.y),p:p});
      });
    });
  }
  const hl=mk("circle",{r:7,fill:"none",stroke:"#111","stroke-width":2.5,display:"none"},svg);
  const ov=mk("rect",{x:m.l,y:m.t,width:W-m.l-m.r,height:H-m.t-m.b,fill:"transparent"},svg);
  ov.addEventListener("mousemove",ev=>{
    const mx=ev.clientX-svg.getBoundingClientRect().left;
    let best=null,bd=1e9;
    anchors.forEach(a=>{const dd=Math.abs(a.x-mx);if(dd<bd){bd=dd;best=a}});
    if(!best)return;
    hl.setAttribute("cx",best.x);hl.setAttribute("cy",best.y);hl.setAttribute("display","");
    tip.innerHTML=best.p.tip;tip.style.display="block";
    tip.style.left=Math.min(ev.clientX+14,window.innerWidth-250)+"px";
    tip.style.top=(ev.clientY+14)+"px";
  });
  ov.addEventListener("mouseleave",()=>{hl.setAttribute("display","none");tip.style.display="none"});
}

function render(days){
  const x0=TODAY-days*MS,x1=TODAY;
  const inR=d=>{const t=tms(d);return t>=x0&&t<=x1+MS};
  const runs=D.runs.filter(r=>inR(r.d));
  const rest=D.rest.filter(r=>inR(r.d));

  // schede con i numeri principali
  const hrs=runs.filter(r=>r.hr).map(r=>r.hr);
  const totKm=runs.reduce((a,r)=>a+r.km,0),totMin=runs.reduce((a,r)=>a+r.min,0);
  const last=rest.length?rest[rest.length-1]:null;
  const kp=[
    ["Corse",runs.length,"negli ultimi "+days+" giorni"],
    ["Km totali",totKm.toFixed(1),"circa "+(totKm/(days/7)).toFixed(1)+" km a settimana"],
    ["FC media corse",hrs.length?Math.round(avg(hrs)):"-","battiti al minuto"],
    ["FC a riposo",last?Math.round(last.v):"-",last?"ultima: "+fmtD(tms(last.d)):"nessun dato"],
    ["Passo medio",totKm>0?fmtPace(totMin/totKm):"-","min/km"]
  ];
  // previsione mezza maratona (formula di Riegel) dalle corse piu lunghe
  const lg=D.runs.filter(r=>r.pace&&r.km>=8),pool=lg.length?lg:D.runs.filter(r=>r.pace&&r.km>=5);
  const pr=pool.map(r=>r.min*Math.pow(21.0975/r.km,1.06)).sort((a,b)=>a-b);
  if(pr.length){
    const md=pr[Math.floor(pr.length/2)],diff=md*60/HALF-GOAL_SEC;
    kp.push(["Previsione mezza",fmtDur(md),"stima "+fmtPace(md/HALF)+" /km (da "+pr.length+" corse)<br>"+(diff<=0?"in linea con l'obiettivo":"servono circa "+Math.ceil(diff)+" s/km in meno")]);
  }else kp.push(["Previsione mezza","-","servono corse da almeno 5 km"]);
  kp.push(["Obiettivo","&lt; "+fmtDur(GOAL),"serve un passo medio di "+goalPaceStr+" /km"]);
  $("kpis").innerHTML=kp.map(k=>'<div class="kpi"><span>'+k[0]+'</span><b>'+k[1]+'</b><small>'+k[2]+'</small></div>').join("");

  // 1) FC nelle corse
  const tipRun=(r,label,val)=>"<b>"+fmtD(tms(r.d))+"</b> "+esc(r.name)+"<br>"+r.km+" km &middot; "+label+" "+Math.round(val)+" bpm";
  const s1=[
    {name:"FC media",color:"#ff2e2e",pts:runs.filter(r=>r.hr).map(r=>({t:tms(r.d),y:r.hr,tip:tipRun(r,"FC media",r.hr)}))},
    {name:"FC massima",color:"#111111",pts:runs.filter(r=>r.max).map(r=>({t:tms(r.d),y:r.max,tip:tipRun(r,"FC max",r.max)}))}
  ];
  legend("l1",s1);
  draw($("c1"),{series:s1,x0:x0,x1:x1,yFmt:v=>Math.round(v)});

  // 2) FC a riposo
  const s2=[{name:"FC a riposo",color:"#ff2e2e",pts:rest.map(r=>({t:tms(r.d),y:r.v,tip:"<b>"+fmtD(tms(r.d))+"</b><br>"+Math.round(r.v)+" bpm a riposo"}))}];
  legend("l2",s2);
  draw($("c2"),{series:s2,x0:x0,x1:x1,yFmt:v=>Math.round(v)});

  // 3) Km per settimana
  const wk={};
  runs.forEach(r=>{const w=weekStart(tms(r.d));wk[w]=(wk[w]||0)+r.km});
  const wpts=[];
  for(let w=weekStart(x0);w<=weekStart(x1);w=weekStart(w+8*MS)){
    const km=wk[w]||0;
    wpts.push({t:w,y:km,tip:"Settimana dal <b>"+fmtD(w)+"</b><br>"+km.toFixed(1)+" km"});
  }
  const s3=[{name:"Km",color:"#ffb800",pts:wpts}];
  legend("l3",s3);
  draw($("c3"),{series:s3,x0:weekStart(x0),x1:weekStart(x1)+7*MS,bars:true,yFmt:v=>Math.round(v)});

  // 4) Passo
  const s4=[{name:"Passo",color:"#111111",pts:runs.filter(r=>r.pace&&r.pace>2&&r.pace<15).map(r=>({t:tms(r.d),y:r.pace,tip:"<b>"+fmtD(tms(r.d))+"</b> "+esc(r.name)+"<br>"+r.km+" km &middot; "+fmtPace(r.pace)+" /km"}))}];
  legend("l4",s4);
  draw($("c4"),{series:s4,x0:x0,x1:x1,yFmt:fmtPace,hline:{y:GOAL_SEC/60,label:"passo obiettivo "+goalPaceStr}});

  // 5) HRV
  const hv=D.hrv.filter(r=>inR(r.d));
  const s5=[
    {name:"Ultima notte",color:"#ff2e2e",pts:hv.filter(r=>r.night).map(r=>({t:tms(r.d),y:r.night,tip:"<b>"+fmtD(tms(r.d))+"</b><br>HRV notte "+Math.round(r.night)+" ms"}))},
    {name:"Media settimanale",color:"#111111",pts:hv.filter(r=>r.week).map(r=>({t:tms(r.d),y:r.week,tip:"<b>"+fmtD(tms(r.d))+"</b><br>HRV media sett. "+Math.round(r.week)+" ms"}))}
  ];
  legend("l5",s5);
  $("k5").style.display=D.hrv.length?"":"none";
  draw($("c5"),{series:s5,x0:x0,x1:x1,yFmt:v=>Math.round(v)});

  // 6) Sonno
  const sl=D.sleep.filter(r=>inR(r.d));
  const s6=[{name:"Ore di sonno",color:"#ffb800",pts:sl.map(r=>({t:tms(r.d),y:r.h,tip:"<b>"+fmtD(tms(r.d))+"</b><br>"+r.h.toFixed(1)+" ore di sonno"}))}];
  legend("l6",s6);
  $("k6").style.display=D.sleep.length?"":"none";
  draw($("c6"),{series:s6,x0:x0,x1:x1,yFmt:v=>v.toFixed(1)});

  // 7) Peso
  const wg=D.weight.filter(r=>inR(r.d));
  const s7=[{name:"Peso",color:"#111111",pts:wg.map(r=>({t:tms(r.d),y:r.kg,tip:"<b>"+fmtD(tms(r.d))+"</b><br>"+r.kg.toFixed(1)+" kg"}))}];
  legend("l7",s7);
  $("k7").style.display=D.weight.length?"":"none";
  draw($("c7"),{series:s7,x0:x0,x1:x1,yFmt:v=>v.toFixed(1)});

  // tabella ultime corse
  const rows=runs.slice().reverse().slice(0,12);
  $("tbl").innerHTML=rows.length?'<table><tr><th>Data</th><th>Corsa</th><th>Km</th><th>Tempo</th><th>Passo</th><th>FC media</th><th>FC max</th></tr>'+
    rows.map(r=>"<tr><td>"+fmtD(tms(r.d))+"</td><td>"+esc(r.name)+"</td><td>"+r.km.toFixed(2)+"</td><td>"+fmtDur(r.min)+"</td><td>"+fmtPace(r.pace)+"</td><td>"+(r.hr?Math.round(r.hr):"-")+"</td><td>"+(r.max?Math.round(r.max):"-")+"</td></tr>").join("")+"</table>":'<div class="empty">Nessuna corsa in questo periodo</div>';
}

// ---------- piano di allenamento ----------
const PLAN=D.plan,NW=PLAN.length;
const KIND={
  fartlek:{lab:"Alta",cls:"p-hi",rpe:"7 nei tratti forti, 3 nei tratti lenti",pace:"tratto forte circa 5:15 /km, tratto lento circa 7:00 /km",zone:"sforzo sostenuto nei tratti forti",z:null,note:"Guida lo sforzo, non il battito: nelle ripetute la FC sale con ritardo."},
  z4:{lab:"Alta",cls:"p-hi",rpe:"7-8 nelle ripetute, 2-3 nel resto",pace:"ripetute 5:00-5:20 /km, recupero circa 7:00 /km o piu lento",zone:"Z4",z:[0.80,0.90],note:"Ripetute controllate: non sprintare. L'ultima deve essere simile alla prima."},
  z3z4:{lab:"Medio-alta",cls:"p-mid",rpe:"6-7",pace:"circa 5:15 /km nei tratti lunghi, recupero lento",zone:"Z3-Z4",z:[0.70,0.90],note:"Sono tratti lunghi: parti controllato, meglio finire forte che partire forte."},
  attivazione:{lab:"Leggera",cls:"p-lo",rpe:"3-4 (i 4 allunghi da 20 secondi un po' piu vivaci)",pace:"facile 6:00-6:40 /km",zone:"Z2",z:[0.60,0.70],note:"E' solo una attivazione per la gara: non deve stancarti."},
  lungo:{lab:"Facile",cls:"p-lo",rpe:"3-4",pace:"6:00-6:40 /km",zone:"Z2",z:[0.60,0.70],note:"Test della conversazione: devi riuscire a parlare per frasi. Se il battito sale, rallenta."},
  gara:{lab:"Gara",cls:"p-race",rpe:"6-7, sostenuto ma controllato",pace:"obiettivo: "+goalPaceStr+" /km di media",zone:"ritmo gara",z:null,note:"Non partire troppo forte nei primi chilometri."}
};
function weekMon(w){return weekStart(weekStart(tms(D.race.date))-(NW-w)*7*MS)}
function matchPlan(){
  return PLAN.map(p=>{
    const s=weekMon(p.w);
    const rs=D.runs.filter(r=>{const t=tms(r.d);return t>=s-MS/2&&t<s+6.5*MS}).slice().sort((a,b)=>b.km-a.km);
    let a=null,b=null;
    if(rs.length>=2){b=rs[0];a=rs[1]}
    else if(rs.length===1){if(rs[0].km>=0.85*p.blo)b=rs[0];else a=rs[0]}
    return {p:p,s:s,a:a,b:b};
  });
}
const fmtRun=r=>r.km.toFixed(1)+" km, "+fmtPace(r.pace)+" /km"+(r.hr?", FC "+Math.round(r.hr):"");
function renderPlan(){
  const nx=$("knext"),pl=$("kplan");
  const has=!!(D.race&&D.race.date);
  const bTxt=p=>(p.w===NW?"gara ":"")+(p.blo===p.bhi?p.blo+" km":p.blo+"-"+p.bhi+" km");
  if(!has){
    nx.innerHTML='<h2>Prossimo allenamento</h2><div class="empty">Per sapere qual e il prossimo allenamento serve la data della gara (riga RACE_DATE in build.py).</div>';
    pl.innerHTML='<h2>Piano di allenamento</h2><div class="tw"><table><tr><th>Sett.</th><th>Fase</th><th>Allenamento A (qualita)</th><th>Lungo B</th></tr>'+
      PLAN.map(p=>"<tr><td>"+p.w+"</td><td>"+p.phase+"</td><td>"+esc(p.a)+"<br><small>circa "+p.akm.toFixed(1)+" km</small></td><td>"+bTxt(p)+"</td></tr>").join("")+"</table></div>";
    return;
  }
  const m=matchPlan();
  const curW=Math.round((weekStart(TODAY)-weekMon(1))/(7*MS))+1;
  const st=(r,wk)=>r?'<span class="ok">fatto</span><br><small>'+fmtRun(r)+'</small>':(wk.s+6*MS<TODAY?'<span class="no">non fatto</span>':'<span class="todo">da fare</span>');

  // tabella del piano
  pl.innerHTML='<h2>Piano di allenamento</h2><p class="hint">Abbinamento automatico: in ogni settimana la corsa piu lunga conta come lungo, l\'altra come allenamento di qualita.</p><div class="tw"><table><tr><th>Sett.</th><th>Date</th><th>Fase</th><th>Allenamento A (qualita)</th><th>Fatto?</th><th>Lungo B</th><th>Fatto?</th></tr>'+
    m.map(w=>{const p=w.p;return '<tr class="'+(p.w===curW?"now":"")+'"><td>'+p.w+'</td><td>'+fmtD(w.s)+' - '+fmtD(w.s+6*MS)+'</td><td>'+p.phase+'</td><td>'+esc(p.a)+'<br><small>circa '+p.akm.toFixed(1)+' km</small></td><td>'+st(w.a,w)+'</td><td>'+bTxt(p)+'</td><td>'+st(w.b,w)+'</td></tr>'}).join("")+'</table></div>';

  // prossimo allenamento
  let n;
  if(curW>NW)n={end:1};
  else if(curW<1)n={w:1,k:"A",before:1};
  else{
    const w=m[curW-1];
    if(!w.a)n={w:curW,k:"A"};
    else if(!w.b)n={w:curW,k:"B"};
    else if(curW<NW)n={w:curW+1,k:"A"};
    else n={end:1};
  }
  if(n.end){nx.innerHTML='<h2>Prossimo allenamento</h2><div class="empty">Il piano e concluso: non ci sono altri allenamenti in programma.</div>';return}
  const p=PLAN[n.w-1],isA=n.k==="A";
  const kk=isA?p.akind:(p.w===NW?"gara":"lungo"),K=KIND[kk];
  const title=isA?p.a:(p.w===NW?"Mezza maratona (gara)":"Lungo aerobico");
  const dist=isA?"circa "+p.akm.toFixed(1)+" km in totale":bTxt(p).replace("gara ","");
  const s=weekMon(p.w);
  const when="Settimana "+p.w+" ("+fmtD(s)+" - "+fmtD(s+6*MS)+")"+(n.before?" - il piano parte il "+fmtD(weekMon(1)):"");
  const mx=Math.max(0,...D.runs.map(r=>r.max||0));
  const hr=K.z?(mx?Math.round(K.z[0]*mx)+"-"+Math.round(K.z[1]*mx)+" bpm <small>(stima provvisoria dal tuo massimo registrato: "+Math.round(mx)+" bpm)</small>":"serve almeno una corsa con la FC registrata"):"il piano non fissa un valore: guida lo sforzo";
  const rows=[
    ["Distanza",dist],
    ["Passo",K.pace+(isA&&p.w<NW?"<br><small>riscaldamento 12' e defaticamento 10' a circa 6:30 /km</small>":"")],
    ["Zona",K.zone],
    ["Battiti (bpm)",hr],
    ["Sforzo percepito (1-10)",K.rpe]
  ];
  const rem=[K.note];
  const lr=D.runs.length?D.runs[D.runs.length-1]:null;
  if(lr&&lr.hr&&mx){
    const q=lr.hr/mx;
    rem.push("Nell'ultima corsa ("+fmtD(tms(lr.d))+") la FC media e stata circa il "+Math.round(q*100)+"% del tuo massimo registrato.");
    if((kk==="lungo"||kk==="attivazione")&&q>0.72)rem.push("Questo allenamento e facile: punta a stare sotto il 70% del massimo e, se serve, rallenta.");
    if((kk==="z4"||kk==="z3z4"||kk==="fartlek")&&q>0.85)rem.push("L'ultima corsa e stata molto intensa: se ti senti stanco riduci di una ripetizione.");
  }
  const lg=Math.max(0,...D.runs.map(r=>r.km));
  if(kk==="lungo"&&p.blo>lg+3)rem.push("Il lungo previsto ("+p.blo+" km) e molto piu lungo della tua corsa piu lunga recente ("+lg.toFixed(1)+" km): come dice il piano, meglio ripetere o ridurre le settimane iniziali che saltare in avanti.");
  rem.push("Dopo la corsa scrivimi in chat come ti sei sentito: adatto il consiglio.");
  nx.innerHTML='<h2>Prossimo allenamento</h2><div class="nx"><span class="pill '+K.cls+'">Intensita consigliata: '+K.lab+'</span><b>'+esc(title)+'</b></div><div class="when">'+when+'</div>'+
    '<table class="kv">'+rows.map(r=>"<tr><td>"+r[0]+"</td><td>"+r[1]+"</td></tr>").join("")+'</table><ul class="rem">'+rem.map(x=>"<li>"+x+"</li>").join("")+'</ul>';
}

// intestazione e conto alla rovescia
$("title").textContent=D.race?D.race.name:"Corsa";
$("upd").textContent="Dati aggiornati al "+D.pulled;
if(D.race&&D.race.date){
  const left=Math.ceil((tms(D.race.date)-Date.now())/MS);
  if(left>=0){$("days").textContent=left;$("racename").textContent="giorni alla gara";$("count").style.display="block"}
}

// pulsanti periodo
const ranges=[30,60,90];let cur=90;
function bar(){
  $("bar").innerHTML=ranges.map(r=>'<button data-d="'+r+'" class="'+(r===cur?"on":"")+'">'+r+' giorni</button>').join("");
  $("bar").querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=+b.dataset.d;bar();render(cur)});
}
bar();render(cur);renderPlan();
let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>render(cur),200)});
</script>
</body>
